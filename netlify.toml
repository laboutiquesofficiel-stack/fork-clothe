[build]
  # Seul ce dossier est publié sur le site. Le code serveur, la base et les
  # archives restent privés.
  publish = "public"

[functions]
  directory = "netlify/functions"

[database.migrations]
  path = "netlify/database/migrations"

# En-têtes de sécurité des pages et fichiers publics (les fonctions définissent
# les leurs dans le code).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
